# ---------------------------------------------------------------- 기존 정의 레지스트리 (판단 유보)
robust_z_registry:
  status: unresolved             # 사용자·교수 승인 전 하나를 정답으로 선언하지 않는다
  definitions:
    rz_D:
      source: "analysis/scripts/universe_final.py rz_D · analysis/robustness/robustness_final.py"
      formula: "med = r.rolling(60, mp=20).median().shift(1); MAD = |r-med|.rolling(60, mp=20).median().shift(1); z=(r-med)/(1.4826·MAD)"
      note: "MAD 가 잔차 |r_s - med_s| (시점별 med) 의 rolling median"
    rz_A:
      source: "analysis/scripts/universe_final.py rz_A · src/final_figs.robust_z (동일)"
      formula: "med = r.rolling(60, mp=40).median().shift(1); MAD = 창 내부 median|x - median(x)| (mp=40) .shift(1)"
      note: "창 내부 MAD (표준 MAD)"
    rz_eda_utils:
      source: "src/eda_utils.extreme_definitions robust_z_shift1_w60_k3"
      formula: "base=r.shift(1); med=base.rolling(60, mp=30).median(); MAD=|base-med|.rolling(60, mp=30).median(); |r-med|/(1.4826·MAD)"
      note: "D 식 구조 + min_periods 30, 절대값만"
  threshold_used_in_existing: "|z| > 3"

existing_rolling_registry:      # A2 정합성 비교는 같은 종류끼리만 한다
  - id: d0122_avg_pairwise
    source: analysis/robustness/d0122_window_loetf.py
    windows: [60, 120, 250]
    kind: "평균 pairwise 상관 (domeq9 / dedup17), pearson · spearman · pearson_ex_top2"
    min_periods: "w (완전 창)"
    note: "KOSPI200 대 개별자산 pair 상관이 아님"
  - id: final_figs_roll_corr
    source: src/final_figs.fig08_rolling_corr_beta · compute()
    windows: [120]
    kind: "ETF vs 069500 Pearson pair 상관 (+β)"
    min_periods: 120
  - id: universe_final_peer
    source: analysis/scripts/universe_final.py (fig 14, 15, peer_stability)
    windows: [60, 120]
    kind: "pair Pearson, min_periods = 0.8w (fig14/15 은 120/100)"
  - id: universe_final_beta60
    source: analysis/scripts/universe_final.py rbeta
    windows: [60]
    kind: "rolling OLS β vs 069500, min_periods 50"
  - id: relation_rolling_corr_120
    source: analysis/relation/rolling_corr_120.csv (A3, scratchpad a3.py — 코드 미보존)
    windows: [120]
    kind: "평균 상관 eq14 / all20 / eq12_ex_lev_inv"
existing_windows_without: [30]       # 30일 상관·0선 교차·persistence 함수는 기존에 없음 (A2 신규)

proposed_for_A2:                 # A1 에서 확정하지 않음 — A2 착수 시 승인 대상
  windows: [30, 60, 120]
