# ---------------------------------------------------------------- A2·A3 채택 (2026-10-11, contract 1.1.0)
adopted_A2_A3:
  windows: [30, 60, 120]
  windows_sensitivity: [250]
  methods: [pearson, spearman]
  min_periods_frac: 0.9          # 완전창(1.0)이면 261240 DQ NaN 2일이 30/60/120일 창 전체를 지운다 → 0.9, 완전창은 민감도 (min_periods_sensitivity.csv)
  rank_policy: "rank_safe(12) 유지. rolling 창 안에서는 반올림 효과 0 (rank_policy_sensitivity.csv)"
  null_band: "±1.96/√w — 독립·정규·비겹침 가정의 표본상관 근사 오차대. 정식 독립성 검정이 아님"
  periods: {dev: "2019-2024", validation: "2025", observation_2026: "2026 — 기존 EDA 가 이미 탐색 → blind holdout 아님"}
  correlation_events:
    C1_zero_cross: "rho 부호 변경일 (raw)"
    C2_large_change: "비겹침 창 Fisher z 차이 |z|>2.58"
    C3_sign_regime: "히스테리시스: |rho|>band 가 persist 일 연속 → 전환. primary band 0.1 persist 10; 민감도 (0,5) (0.2,10) (0.1,20)"
    C4_multi_window: "C3 또는 C2 가 서로 다른 창 ≥2 개에서 ±10 거래일 안 같은 방향"
    C5_method_concordant: "C3 가 Pearson·Spearman 양쪽에서 ±5 거래일 안 같은 방향 (지시문 원문 C5 정의 누락 → A 가 정의)"
  price_events: "src/r2h/research_a/price_events.py 모듈 docstring (P1~P5, 부호 분리, P4 사후 라벨)"
  matching: "일대일 greedy |lag| ≤ L, L ∈ {0,5,10,20}; 근접 ≠ 인과; Ground Truth 아님"
  null_test: "P 위치 원형 이동 (군집 보존), T = ±L 안 P 가 있는 C 수, p=(1+#)/(B+1), B=1000 (p≤0.01 은 B=20000 재추정)"
  multiple_testing: "BH — global(검정가능 전부) + primary(C3_b0.100_k10 × candidate_at × lag 10)"
