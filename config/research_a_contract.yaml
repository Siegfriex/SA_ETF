# ---------------------------------------------------------------- 가격·수익률 정의
price:
  field: Close                        # FDR Close 그대로. Open/High/Low 는 수익률 계산에 쓰지 않는다
  adjustment_status: ESTIMATED_DISTRIBUTION_ADJUSTED_UNVERIFIED
  adjustment_evidence:
    - "MANIFEST.adjusted_policy (C-0012 DEC-3): 069500/KS200 누적비 1.155 ≈ KOSPI200 TR 1.163 → 분배 소급조정 추정"
    - "raw Change 열 = Close.pct_change() (|Δ|≤1e-16) → Change 는 Close 파생값이라 조정 여부의 독립 증거가 아니다"
    - "Close>High 212건(229200·305540·143860, 비율 ≤1.0005, 2019~2025) → Close 와 H/L 의 조정 기준 불일치 또는 반올림과 정합하나 증명은 아님"
  not_claimed: "조정주가(adjusted)로 확정하지 않는다. 분배일 하락이 Close 에 남아 있을 가능성을 배제하지 않는다"

returns:
  primary: daily_log_return
  formula: "r_t = ln(Close_t / Close_{t-1})"
  unit: "자연로그, 일간(거래일), 비연율화. 연율화가 필요하면 ×√252 를 표시와 함께 별도 적용"
  index: "KRX 거래일 DatetimeIndex (공통 날짜 = 20종 모두 Close 존재하는 날)"
  first_row: dropped                  # 첫 거래일 2019-01-02 는 수익률 없음 → 1902 행
  numeric_implementation:
    a_default: logdiff                # ln(C_t) - ln(C_{t-1}) — validate_raw.py / panel_logret.csv 와 비트 수준 일치(≤1e-16)
    alternative_in_existing: logratio # ln(C_t/C_{t-1}) — universe_final.py · d0122 (robustness_final 은 logdiff)
    max_abs_gap: 1.84e-15
    rank_stat_rule: "Spearman 등 순위 통계는 rank_safe(round 12) 후 계산 — 1e-15 차이가 동률을 깨 Spearman 이 최대 6e-6 달라짐 (A1 발견)"
  matches_existing: [scripts/validate_raw.py, analysis/scripts/universe_final.py, analysis/robustness/robustness_final.py, src/final_figs.py, src/eda_utils.engineer_basic]
  variants:
    raw:
      description: "DQ 처리 없음. canonical interim panel_logret.csv 와 수치 동일해야 한다"
      equals: data/interim/panel_logret.csv
    dq_trim_canonical:
      description: "price_anomaly_unverified 2건만 NaN (행 삭제·보간 없음). 기존 Rt / ANOM 처리와 동일"
      nan_cells: {"261240": ["2019-03-14", "2019-03-15"]}
      matches_existing: ["analysis/scripts/universe_final.py DQ_DAYS → Rt", "analysis/robustness/robustness_final.py ANOM → R"]
  flag_only:                          # 값은 그대로 두고 flag 열로만 노출
    - "ohlc_close_gt_high (212): Close→logret 경로에 영향 없음 (O/H/L 미사용)"
    - "spike_reversal_candidate (6): 219480 2025-04-08·09, 153130 2024-01-30·31, 192090 2024-10-07·08 — 민감도로만 보고"

