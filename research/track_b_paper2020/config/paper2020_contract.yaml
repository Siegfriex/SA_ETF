equations:
  eq_1:
    source: {physical_pdf_page: 32, article_page: 3}
    definition: "y_t = sigma_t e_t; sigma_t^2 = g(y_{t-1}^2,...,y_{t-p}^2,sigma_{t-1}^2,...,sigma_{t-q}^2)"
    assumptions: "e_t iid with mean 0 and variance 1; p,q nonnegative integers"
    implementation_target: "src/r2h/paper2020/svr_garch.py::SVRGARCHSpec"
  eq_2:
    source: {physical_pdf_page: 32, article_page: 3}
    definition: "epsilon-insensitive loss: max(|y-f(x)|-epsilon, 0), with equality branch at |y-f(x)| >= epsilon"
    implementation_target: "document sklearn SVR loss equivalence; no custom solver planned"
  eq_3:
    source: {physical_pdf_page: 32, article_page: 3}
    definition: "minimize 0.5||w||^2 + C sum_i(tilde_xi_{1,i}+tilde_xi_{2,i}), subject to y_i-w^T phi(x_i)-b <= epsilon+tilde_xi_{2,i}; w^T phi(x_i)+b-y_i <= epsilon+tilde_xi_{1,i}; tilde_xi_{1,i},tilde_xi_{2,i} >= 0"
    implementation_target: "sklearn.svm.SVR parity contract"
  eq_4:
    source: {physical_pdf_page: 33, article_page: 4}
    definition: >-
      L=0.5||w||^2+C sum_i(tilde_xi_{1,i}+tilde_xi_{2,i})
      -sum_i(beta_{1,i}tilde_xi_{1,i}+beta_{2,i}tilde_xi_{2,i})
      -sum_i alpha_{1,i}(epsilon+tilde_xi_{1,i}-y_i+w^T phi(x_i)+b)
      -sum_i alpha_{2,i}(epsilon+tilde_xi_{2,i}+y_i-w^T phi(x_i)-b)
    implementation_target: "derivation/documentation only"
  eq_5:
    source: {physical_pdf_page: 33, article_page: 4}
    definition: >-
      w-sum_i(alpha_{1,i}-alpha_{2,i})phi(x_i)=0;
      sum_i(alpha_{1,i}-alpha_{2,i})=0;
      C-alpha_{1,i}-beta_{1,i}=0; C-alpha_{2,i}-beta_{2,i}=0;
      alpha_{1,i},alpha_{2,i},tilde_xi_{1,i},tilde_xi_{2,i}>=0
    implementation_target: "derivation/documentation only"
  eq_6:
    source: {physical_pdf_page: 33, article_page: 4}
    definition: >-
      alpha_{1,i}(epsilon+tilde_xi_{1,i}-y_i+w^T phi(x_i)+b)=0;
      alpha_{2,i}(epsilon+tilde_xi_{2,i}+y_i-w^T phi(x_i)-b)=0;
      (C-alpha_{1,i})tilde_xi_{1,i}=0; (C-alpha_{2,i})tilde_xi_{2,i}=0
    implementation_target: "derivation/documentation only"
  eq_7:
    source: {physical_pdf_page: 33, article_page: 4}
    definition: >-
      maximize -0.5 sum_i sum_j (alpha_{1,i}-alpha_{2,i})(alpha_{1,j}-alpha_{2,j})
      phi(x_i)^T phi(x_j) - epsilon sum_i(alpha_{1,i}+alpha_{2,i})
      + sum_i(alpha_{1,i}-alpha_{2,i})y_i;
      subject to sum_i(alpha_{1,i}-alpha_{2,i})=0 and 0<=alpha_{1,i},alpha_{2,i}<=C
    implementation_target: "sklearn.svm.SVR parity contract"
  eq_8:
    source: {physical_pdf_page: 34, article_page: 5}
    definition: "f_hat(x)=sum_i(alpha_1i-alpha_2i)K(x_i,x)+b_hat; support-vector representation"
    implementation_target: "src/r2h/paper2020/svr_garch.py::fit_svr_variance"
  eq_9:
    source: {physical_pdf_page: 34, article_page: 5}
    definition: "x_s=(y_breve_s^T,sigma_breve_s^T)^T; y_breve_s=(y_{s-p}^2,...,y_{s-1}^2)^T; sigma_breve_s=(sigma_{s-q}^2,...,sigma_{s-1}^2)^T"
    implementation_target: "src/r2h/paper2020/features.py::build_lagged_design"

svr_garch:
  kernel:
    paper: "K(x,y)=exp(-||x-y||^2/(2*gamma^2))"
    sklearn: "K(x,y)=exp(-gamma_sklearn*||x-y||^2)"
    mapping: "gamma_sklearn = 1/(2*paper_gamma_squared)"
    numerical_equivalence_test: "required"
  parameter_ranges:
    C: {min: 1.0, max: 100.0}
    paper_gamma_squared: {min: 0.1, max: 1.0}
    epsilon: {min: 0.1, max: 1.0}
    exact_grid_points: null
  lag_order_for_experiments: {p: 1, q: 1}
  proxy:
    m: 5
    general: "sigma_tilde_t^2 = (1/m) sum_{j=1}^m y_{t-j+1}^2"
    early: "for t<m, sigma_tilde_t^2 = (1/t) sum_{j=1}^t y_{t-j+1}^2"
  procedure:
    step_1: "Prescribe tuning points; chronological training size n and validation size n_prime"
    step_2: "Construct moving-average conditional-variance proxy from squared observations"
    step_3: "Fit SVR g_hat using proxy lags; obtain sigma_hat_t^2"
    step_4: "Apply same proxy formula to validation and compute MAE=(1/n_prime)sum|sigma_hat_t^2-sigma_tilde_t^2|"
    step_5: "Select minimum-MAE combination; refit Steps 2-3 on combined training+validation"
  remarks:
    remark_1: "Grid search is used; m=5 reported as most consistently satisfactory"
    remark_2: "Iterative sigma_hat updating is rejected because fits flatten to a constant or follow proxy peaks"
    remark_3: "MAE is retained; MSE/RMSE amplify/shrink losses, while the paper's MAPE explanation says it uses an 'unobservable sigma_tilde_t^2 rather than sigma_hat_t^2'; the meaning of that phrase is itself unclear"

cusum:
  source: {physical_pdf_pages: [35, 36], article_pages: [6, 7]}
  parametric_reference:
    model: "y_t=sigma_t e_t; sigma_t^2=omega+alpha*y_{t-1}^2+beta*sigma_{t-1}^2; omega>0; alpha,beta>=0; alpha+beta<1"
    hypotheses: "H0: omega,alpha,beta remain the same for t=1,...,n; H1: not H0"
    residual: "e_hat_t=y_t/sigma_hat_t"
    recursion_as_printed: "sigma_hat_t^2=omega_hat+alpha_hat*y_{t-1}^2+beta_hat*sigma_{t-1}^2"
    initials_as_printed: "y_0=0; sigma_0^2=y_1"
    warning: "The prior variance lacks a hat and sigma_0^2=y_1 is dimensionally/positivity problematic; do not silently correct"
  residual: "e_hat_t = y_t/sigma_hat_t"
  centered_path: "D_k = sum_{t=1}^k e_hat_t^2 - (k/n) sum_{t=1}^n e_hat_t^2"
  variance_estimator: "tau_hat_n^2 = (1/n)sum e_hat_t^4 - ((1/n)sum e_hat_t^2)^2"
  statistic: "T_hat_n = max_{1<=k<=n} |D_k|/(sqrt(n)*tau_hat_n)"
  theoretical_reference: "T_n=max_{1<=k<=n}|sum_{t=1}^k e_t^2-(k/n)sum_{t=1}^n e_t^2|/(sqrt(n)*tau), where tau^2=Var(e_1^2)"
  null_limit: "sup_{0<=s<=1}|B_circ(s)|, where B_circ is a standard Brownian bridge"
  alpha: 0.05
  critical_value: 1.3397
  reject_rule: "T_hat_n >= 1.3397"
  localization: "k_hat_n = argmax_{1<=k<=n}|D_k|, reported separately from rejection"
  mode: "retrospective_single_change_primary"
  golden_test:
    residuals: [1.0, 1.0, 1.0, 3.0]
    squared: [1.0, 1.0, 1.0, 9.0]
    centered_path: [-2.0, -4.0, -6.0, 0.0]
    tau_squared: 12.0
    statistic: 0.8660254037844386
    argmax_one_based: 3
    reject_at_5pct: false

simulation:
  source: {physical_pdf_pages: [36, 39], article_pages: [7, 10]}
  n_values: [500, 1000, 2000]
  generated_length: "2*n"
  splits:
    training: "first 0.7*n"
    validation: "next 0.3*n"
    testing: "remaining n"
  repetitions: 1000
  alpha: 0.05
  innovations: "iid standard normal"
  change_location_text: "middle of the time series"
  change_location_index: null
  dgp:
    garch: "sigma_t^2=omega+alpha*y_{t-1}^2+beta*sigma_{t-1}^2"
    agarch: "sigma_t^2=omega+alpha*(y_{t-1}-b)^2+beta*sigma_{t-1}^2"
    gjr_garch: "sigma_t^2=omega+alpha_1*(y_{t-1}^+)^2+alpha_2*(y_{t-1}^-)^2+beta*sigma_{t-1}^2"
    tgarch: "sigma_t=omega+alpha*abs(y_{t-1})+beta*sigma_{t-1}"
    log_linear_garch: "log(sigma_t^2)=omega+alpha*log(y_{t-1}^2)+beta*log(sigma_{t-1}^2)"
  baselines:
    garch: {omega: 0.3, alpha: 0.3, beta: 0.3}
    agarch: {omega: 0.3, alpha: 0.3, beta: 0.4, b: 1.0}
    gjr_garch: {omega: 0.3, alpha_1: 0.3, alpha_2: 0.4, beta: 0.3}
    tgarch: {omega: 0.3, alpha: 0.3, beta: 0.3}
    log_linear_garch: {omega: 0.3, alpha: 0.3, beta: 0.3}
  literal_truncation:
    N: 20.0
    rule: "e_tilde=e_hat*I(abs(e_hat)<N)+N*I(abs(e_hat)>=N)"
    applies_to: ["table_5", "table_6_case_1", "table_6_case_2"]
    warning: "Non-sign-preserving as printed; sensitivity alternatives must be separate"
